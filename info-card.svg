:1.46s"><tspan fill="#bc8cff" font-weight="700">Desktop</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#c9d1d9">PySide6 (Qt) · Excel VBA</tspan></text><text class="l" x="24" y="284" style="animation-delay:1.57s"><tspan fill="#bc8cff" font-weight="700">Infra</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#c9d1d9">Docker · Cloudflare · MySQL · Redis</tspan></text><text class="l" x="24" y="303" style="animation-delay:1.68s"><tspan fill="#bc8cff" font-weight="700">APIs</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#c9d1d9">Mercado Livre · Shopee · Magalu · Amazon</tspan></text><text class="l" x="24" y="334" style="animation-delay:1.90s"><tspan fill="#e3b341" font-weight="700">Destaques</tspan></text><text class="l" x="24" y="353" style="animation-delay:2.01s"><tspan fill="#c9d1d9">▸ App de preços p/ 4 marketplaces (~2.500 testes)</tspan></text><text class="l" x="24" y="372" style="animation-delay:2.12s"><tspan fill="#c9d1d9">▸ Central de agentes 24/7 em Docker (600+ testes)</tspan></text><text class="l" x="24" y="391" style="animation-delay:2.23s"><tspan fill="#c9d1d9">▸ Painel de preços que trocou ferramenta paga</tspan></text><text class="l" x="24" y="410" style="animation-delay:2.34s"><tspan fill="#c9d1d9">▸ Sistema web de gestão no ar na Cloudflare</tspan></text>
